<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<div id="app" class="space-y-4 max-w-md mx-auto mt-6">
    <!-- Quick filter with settings button -->
    <div class="flex items-center gap-2">
        <input v-model="state.quick" placeholder="Quick search..."
            class="flex-1 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
        <button @click="toggleAdvanced" class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 shadow-sm"
            title="Advanced filters">
            ⚙️
        </button>
    </div>

    <!-- Advanced filters -->
    <div v-if="showAdvanced" class="space-y-3 p-4 bg-gray-50 rounded-lg border border-gray-200">
        <div v-for="(cfg, field) in advancedFields" :key="field" class="flex flex-col">
            <p class="text-sm font-medium text-gray-700 mb-1">{{ cfg.label || field }}</p>

            <!-- String input -->
            <input v-if="cfg.type === 'string'" v-model="state[field]" :placeholder="`Search ${field}`"
                class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">

            <!-- Lookup tags -->
            <div v-else-if="cfg.type === 'lookup'" class="flex flex-wrap gap-2">
                <span v-for="opt in cfg.lookups" :key="opt.value" @click="toggleTag(field, opt.value, cfg.multi)"
                    :class="tagClass(field, opt.value, cfg.multi)"
                    class="px-3 py-1 rounded-full cursor-pointer text-sm border transition-all duration-200">
                    {{ opt.label }}
                </span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-2 mt-2">
            <button @click="resetFilters"
                class="flex-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow hover:bg-gray-300">Reset</button>
        </div>
    </div>

    <!-- Items -->
    <div class="space-y-2">
        <div v-for="item in filteredItems" :key="item.title" class="item p-3 border rounded-lg shadow-sm">
            {{ item.title }}
        </div>
    </div>
</div>

<script>
    const { createApp, reactive, computed, ref, watch } = Vue;
    const { isArray, isEmpty } = _;

    createApp({
        setup() {
            const filterConfig = {
                quick: { field: "title", label: "Search...", type: "string" },
                field1: { type: "string", label: "Field 1" },
                "field2.innerField1": {
                    type: "lookup",
                    label: "Inner Field",
                    multi: true,
                    lookups: [
                        { label: "ABC", value: "abc" },
                        { label: "XYZ", value: "xyz" }
                    ]
                }
            };

            const items = reactive([
                { title: "🐉 The red dragon", field1: "hello world", field2: { innerField1: "abc" } },
                { title: "🛡 Blue knight", field1: "example text", field2: { innerField1: "xyz" } },
                { title: "🌲 Green forest", field1: "other", field2: { innerField1: "abc" } },
            ]);

            const showAdvanced = ref(false);
            const state = reactive({});
            const filteredItems = ref(items);

            const advancedFields = Object.fromEntries(
                Object.entries(filterConfig).filter(([key]) => key !== 'quick')
            );

            // Initialize state
            Object.keys(filterConfig).forEach(key => {
                if (filterConfig[key].type === 'lookup') {
                    state[key] = filterConfig[key].multi ? [] : null;
                } else {
                    state[key] = "";
                }
            });

            const toggleTag = (field, value, multi) => {
                if (multi) {
                    const idx = state[field].indexOf(value);
                    if (idx !== -1) state[field].splice(idx, 1);
                    else state[field].push(value);
                } else {
                    state[field] = state[field] === value ? null : value;
                }
            };

            const tagClass = (field, value, multi) => {
                if (multi) {
                    const selected = state[field].includes(value);
                    return selected ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-gray-700 border-gray-300";
                } else {
                    const selected = state[field] === value;
                    return selected ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-gray-700 border-gray-300";
                }
            };

            const resetFilters = () => {
                Object.keys(filterConfig).forEach(key => {
                    if (filterConfig[key].type === 'lookup') {
                        state[key] = filterConfig[key].multi ? [] : null;
                    } else {
                        state[key] = "";
                    }
                });
            };

            const applyFilters = () => {
                filteredItems.value = items.filter(item => {
                    // Quick search
                    if (state.quick && !item[filterConfig.quick.field]
                        ?.toLowerCase()
                        .includes(state.quick.toLowerCase())) {
                        return false;
                    }

                    for (const [field, value] of Object.entries(state)) {
                        if (!value || isEmpty(value) || field === "quick") continue;

                        const cfg = filterConfig[field];
                        const fieldValue = field.split(".").reduce((acc, k) => acc?.[k], item);

                        if (cfg.type === "string") {
                            if (!fieldValue?.toLowerCase().includes(value.toLowerCase())) {
                                return false;
                            }
                        } else if (cfg.type === "lookup") {
                            if (cfg.multi) {
                                if (!value.includes(fieldValue)) return false;
                            } else {
                                if (fieldValue !== value) return false;
                            }
                        }
                    }

                    return true;
                });
            };
            const debouncedApplyFilters = _.debounce(applyFilters, 300);
            watch(state, () => {
                debouncedApplyFilters();
            }, { deep: true });

            const toggleAdvanced = () => {
                showAdvanced.value = !showAdvanced.value;
            };


            return {
                state,
                items,
                filteredItems,
                advancedFields,
                showAdvanced,
                toggleTag,
                tagClass,
                resetFilters,
                toggleAdvanced
            };
        }
    }).mount("#app");
</script>
